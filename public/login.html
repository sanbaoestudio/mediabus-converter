<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ingresar · Mediabus Converter</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1D112E" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    @font-face { font-family: 'Epilogue'; font-weight: 800; font-display: swap; src: url(/fonts/epilogue-latin-800-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(/fonts/inter-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url(/fonts/inter-latin-600-normal.woff2) format('woff2'); }
    :root { --violet: #2D1A47; --deep: #1D112E; --lime: #8BBC28; --magenta: #D23B79; --muted: #C9BEDA; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--deep); color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
    .glow { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .a { width: 480px; height: 480px; background: var(--magenta); right: -200px; top: -120px; opacity: .3; }
    .b { width: 420px; height: 420px; background: var(--lime); left: -220px; bottom: -180px; opacity: .2; }
    .card { position: relative; width: 100%; max-width: 400px; background: var(--violet); border: 1px solid rgba(255,255,255,.12); border-radius: 32px; padding: 36px 28px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .logo { display: block; width: 200px; height: auto; margin: 0 auto 28px; }
    h1 { font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15; margin: 0 0 6px; text-align: center; }
    .sub { color: var(--muted); text-align: center; margin: 0 0 26px; font-size: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
    input { width: 100%; font: 400 16px 'Inter', system-ui, sans-serif; color: #fff; background: var(--deep); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; margin: 0 0 16px; outline: none; transition: border-color .15s; }
    input:focus { border-color: var(--lime); }
    button { width: 100%; margin-top: 6px; font: 800 17px 'Epilogue', system-ui, sans-serif; color: var(--deep); background: var(--lime); border: 0; border-radius: 999px; padding: 15px; cursor: pointer; transition: transform .15s; }
    button:hover { transform: translateY(-1px); }
    .error { display: none; background: rgba(210,59,121,.2); color: #FFB3D2; border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 0 0 18px; text-align: center; }
    .error.on { display: block; }
  </style>
</head>
<body>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>
  <main class="card">
    <img class="logo" src="/logo-mediabustv.png" alt="MediaBusTV" width="700" height="101" />
    <h1>Mediabus Converter</h1>
    <p class="sub">Ingresá para convertir tus videos.</p>
    <p class="error" id="error" role="alert"></p>
    <form method="post" action="/api/login">
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" autocapitalize="none" required />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Ingresar</button>
    </form>
  </main>
  <script>
    var e = new URLSearchParams(location.search).get('error'), box = document.getElementById('error');
    if (e) { box.textContent = e === 'config' ? 'El acceso todavía no está configurado.' : 'Usuario o contraseña incorrectos.'; box.className = 'error on'; }
  </script>
</body>
</html>
