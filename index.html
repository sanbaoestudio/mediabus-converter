<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mediabus Converter</title>
  <meta name="description" content="Convertí tus videos para las pantallas de MediaBus." />
  <meta name="theme-color" content="#1D112E" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="top">
    <img class="logo" src="/logo-mediabustv.png" alt="MediaBusTV" width="700" height="101" />
    <span class="pill pill-ghost">Converter</span>
  </header>

  <main>
    <section class="hero">
      <h1>Videos listos<br />para la <span class="lime">pantalla</span>.</h1>
      <p class="lead">Subí tus piezas y descargalas listas para las pantallas de MediaBus: más livianas y sin trabas.</p>
      <p class="privacy"><span class="dot"></span>Todo se procesa en tu dispositivo. Ningún video se sube a un servidor.</p>
      <svg class="route" viewBox="0 0 600 120" aria-hidden="true">
        <defs>
          <linearGradient id="rg" x1="0" x2="1">
            <stop offset="0" stop-color="#8BBC28" />
            <stop offset=".55" stop-color="#00B4C8" />
            <stop offset="1" stop-color="#D23B79" />
          </linearGradient>
        </defs>
        <path d="M20 90 H250 Q290 90 290 55 Q290 20 330 20 H580" fill="none" stroke="url(#rg)" stroke-width="22" stroke-linecap="round" />
        <circle cx="20" cy="90" r="11" fill="#1D112E" stroke="#8BBC28" stroke-width="6" />
        <circle cx="580" cy="20" r="11" fill="#1D112E" stroke="#D23B79" stroke-width="6" />
      </svg>
    </section>

    <section class="app" aria-label="Conversor">
      <div class="step">
        <span class="num">1</span>
        <h2>Elegí qué necesitás</h2>
      </div>
      <div class="profiles" role="radiogroup" id="profiles"></div>

      <div class="step">
        <span class="num">2</span>
        <h2>Sumá tus videos</h2>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="video/*,.mp4,.mov,.m4v,.mkv,.webm,.avi" multiple />
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 32V12m0 0-8 8m8-8 8 8M10 30v4a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-4" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>Arrastrá los videos acá</strong>
        <span>o tocá para elegirlos</span>
      </label>

      <ul class="queue" id="queue"></ul>

      <div class="actions">
        <button class="btn btn-primary" id="go" disabled>Convertir</button>
        <button class="btn btn-ghost" id="zip" hidden>Descargar todo (.zip)</button>
        <button class="btn btn-link" id="clear" hidden>Vaciar lista</button>
      </div>
      <p class="engine" id="engine">Preparando…</p>
    </section>
  </main>

  <footer class="foot">
    <img src="/isotipo.png" alt="" width="28" height="28" />
    <span>Mediabus Converter</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
